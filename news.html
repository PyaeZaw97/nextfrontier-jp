        <style>

        *{
        margin:0;
        padding:0;
        box-sizing:border-box;
        }

        body{
        font-family:'Poppins',sans-serif;
        background:#f4f6f9;
        color:#333;
        }
        /* Navigation */

        .navbar{
            position:sticky;
            top:0;
            z-index:1000;
            background:white;
            box-shadow:0 2px 15px rgba(0,0,0,.08);
        }

        .nav-container{
            max-width:1200px;
            margin:auto;
            display:flex;
            justify-content:space-between;
            align-items:center;
            padding:15px 20px;
        }

        .logo{
            text-decoration:none;
            font-size:24px;
            font-weight:700;
            color:#0f4c81;
        }

        .nav-menu{
            list-style:none;
            display:flex;
            gap:25px;
        }

        .nav-menu a{
            text-decoration:none;
            color:#333;
            font-weight:500;
            transition:.3s;
        }

        .nav-menu a:hover{
            color:#0f4c81;
        }

        .nav-menu a.active{
            color:#0f4c81;
            border-bottom:3px solid #0f4c81;
            padding-bottom:5px;
        }

        .header{
        position:relative;
        background-image:url('https://images.unsplash.com/photo-1504711434969-e33886168f5c');
        background-size:cover;
        background-position:center;
        background-repeat:no-repeat;
        color:white;
        padding:120px 20px;
        text-align:center;
        overflow:hidden;
        }

        .header::before{
        content:"";
        position:absolute;
        top:0;
        left:0;
        width:100%;
        height:100%;
        background:rgba(0,0,0,0.55);
        }

        .header h1,
        .header p{
        position:relative;
        z-index:2;
        }

        .header h1{
        font-size:48px;
        margin-bottom:15px;
        text-shadow:0 2px 10px rgba(0,0,0,.4);
        }

        .header p{
        font-size:20px;
        opacity:.95;
        }

        .header h1{
        font-size:42px;
        margin-bottom:10px;
        }

        .header p{
        font-size:18px;
        opacity:.9;
        }

        .container{
        max-width:1200px;
        margin:auto;
        padding:30px 20px;
        }

        .search-box{
        margin-bottom:30px;
        }

        .search-box input{
        width:100%;
        padding:15px;
        border:1px solid #ddd;
        border-radius:10px;
        font-size:16px;
        }

        /* Featured */

        .featured{
        background:white;
        border-radius:15px;
        overflow:hidden;
        margin-bottom:30px;
        box-shadow:0 5px 20px rgba(0,0,0,.08);
        cursor:pointer;
        }

        .featured-image{
        height:350px;
        background:url('https://picsum.photos/1200/500');
        background-size:cover;
        background-position:center;
        }

        .featured-content{
        padding:25px;
        }

        .featured-title{
        font-size:30px;
        color:#0f4c81;
        margin-bottom:15px;
        }

        .featured-date{
        color:#777;
        margin-bottom:10px;
        }

        /* Cards */

        .news-grid{
        display:grid;
        grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
        gap:25px;
        }

        .news-card{
        background:white;
        border-radius:15px;
        overflow:hidden;
        box-shadow:0 5px 15px rgba(0,0,0,.08);
        transition:.3s;
        }

        .news-card:hover{
        transform:translateY(-5px);
        }

        .card-image{
        height:200px;
        background:url('https://picsum.photos/600/400');
        background-size:cover;
        }

        .card-body{
        padding:20px;
        }

        .news-date{
        font-size:13px;
        color:#777;
        margin-bottom:10px;
        }

        .news-title{
        font-size:22px;
        color:#0f4c81;
        margin-bottom:15px;
        }

        .news-content{
        color:#555;
        line-height:1.7;
        margin-bottom:20px;
        }

        .read-btn{
        background:#0f4c81;
        color:white;
        border:none;
        padding:10px 15px;
        border-radius:8px;
        cursor:pointer;
        }

        /* Pagination */

        .pagination{
        display:flex;
        justify-content:center;
        gap:10px;
        margin-top:40px;
        flex-wrap:wrap;
        }

        .pagination button{
        width:45px;
        height:45px;
        border:none;
        border-radius:8px;
        cursor:pointer;
        background:white;
        box-shadow:0 2px 8px rgba(0,0,0,.08);
        }

        .pagination button.active{
        background:#0f4c81;
        color:white;
        }

        /* Modal */

        .modal{
        display:none;
        position:fixed;
        top:0;
        left:0;
        width:100%;
        height:100%;
        background:rgba(0,0,0,.7);
        z-index:999;
        overflow:auto;
        padding:20px;
        }

        .modal-content{
        background:white;
        max-width:900px;
        margin:40px auto;
        border-radius:15px;
        padding:30px;
        position:relative;
        }

        .close{
        position:absolute;
        right:20px;
        top:10px;
        font-size:35px;
        cursor:pointer;
        }

        .modal-title{
        font-size:32px;
        margin-bottom:15px;
        color:#0f4c81;
        }

        .modal-date{
        color:#777;
        margin-bottom:20px;
        }

        .modal-text{
        line-height:1.9;
        }

        /* Footer */

        .footer{
        background:#111;
        color:#ccc;
        padding:25px;
        text-align:center;
        margin-top:50px;
        }

        .loading{
        text-align:center;
        padding:50px;
        }

        @media(max-width:768px){

        .header h1{
        font-size:30px;
        }

        .featured-title{
        font-size:24px;
        }

        .news-title{
        font-size:20px;
        }

        }
        .modal {
        position: fixed;
        z-index: 99999; 
    }

        </style>

    <div class="header">
        <h1>News & Announcements</h1>
        <p>Latest company updates and important announcements</p>
    </div>

    <div class="container">

        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Search news...">
        </div>
        <div id="featured"></div>

        <div id="news-list" class="news-grid">
            <div class="loading">Loading news...</div>
        </div>

        <div id="pagination" class="pagination"></div>

    </div>

    <div id="newsModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal()">&times;</span>

            <div id="modalTitle" class="modal-title"></div>
            <div id="modalDate" class="modal-date"></div>
            <div id="modalContent" class="modal-text"></div>
        </div>
    </div>

    <footer class="footer">
    © 2026 News Portal. All Rights Reserved.
    </footer>

    <script>

        const API_URL="https://script.google.com/macros/s/AKfycbywNnySD8TaxDvjqmE-xmt1MO5FmBOPjr_QtbYQoce_1gljmA0UidRW3hissHvXJZfM/exec";

        const LIMIT=10;

        let allNews=[];

        function loadNews(page=1){

            document.getElementById("news-list").innerHTML= '<div class="loading">Loading...</div>';

            fetch(`${API_URL}?page=${page}&limit=${LIMIT}`).then(r=>r.json()).then(data=>{

                allNews=data.news;

                renderFeatured(data.news[0]);

                renderNews(data.news);

                renderPagination(
                data.currentPage,
                data.totalPages
                );

            });
        }

        function renderFeatured(item){

            if(!item) return;

            const date= new Date(item.date).toLocaleDateString('en-GB');

            document.getElementById('featured').innerHTML=`

                <div class="featured" onclick="showNews(0)">

                <div class="featured-image"></div>

                <div class="featured-content">

                <div class="featured-date">
                    ${date}
                </div>

                <h2 class="featured-title">
                    ${item.title}
                </h2>

                <p>
                ${item.content.substring(0,250)}...
                </p>

                </div>

                </div>
                `;
             }

        function renderNews(news){

        let html='';

        news.forEach((item,index)=>{

        const date= new Date(item.date).toLocaleDateString('en-GB');

        const shortContent= item.content.length>150 ? item.content.substring(0,150)+'...': item.content;
        html+=`

            <div class="news-card">

                <div class="card-image"></div>

                <div class="card-body">

                    <div class="news-date">
                        ${date}
                    </div>

                    <div class="news-title">
                        ${item.title}
                    </div>

                    <div class="news-content">
                        ${shortContent}
                    </div>

                    <button class="read-btn" onclick="showNews(${index})">
                        Read More
                    </button>
                </div>
            </div>
            `;
        });

        document.getElementById('news-list').innerHTML= html;
        }

        function showNews(index){

            const item=allNews[index];

            document.getElementById('modalTitle').innerText=item.title;

            document.getElementById('modalDate').innerText=new Date(item.date).toLocaleDateString('en-GB');

            document.getElementById('modalContent').innerText=item.content;

            document.getElementById('newsModal').style.display='block';
        }

        function closeModal(){

            document.getElementById('newsModal').style.display='none';
        }

        window.onclick=function(event){

        const modal=
        document.getElementById('newsModal');

        if(event.target===modal){

        modal.style.display='none';
        }
        }

        function renderPagination(current,total){

        let html='';

        for(let i=1;i<=total;i++){

        html+=`
        <button
        class="${i===current?'active':''}"
        onclick="loadNews(${i})">
        ${i}
        </button>
        `;
        }

        document.getElementById('pagination')
        .innerHTML=html;
        }

        document
        .getElementById('searchInput')
        .addEventListener('keyup',function(){

        const keyword=
        this.value.toLowerCase();

        const filtered=
        allNews.filter(item=>

        item.title
        .toLowerCase()
        .includes(keyword)

        ||

        item.content
        .toLowerCase()
        .includes(keyword)

        );

        renderNews(filtered);
        });

        loadNews(1);

        </script>
    <script src="js/global.js"></script>
    <script src="js/index.js"></script>
